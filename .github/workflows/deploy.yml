# Deploy no GCP via Cloud Build Trigger (repositório já ligado no GCP).
# O código é obtido pelo Google a partir do GitHub — não usa gcloud builds submit
# nem upload para o bucket *_cloudbuild.
#
# Autenticação: Workload Identity Federation (OIDC) — sem chave JSON no GitHub.
#
# Secrets (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_WIF_SERVICE_ACCOUNT  → precisa conseguir executar builds (ex.: roles/cloudbuild.builds.editor)
#
# IMPORTANTE — builds duplicados:
# Se no Console (Cloud Build → Triggers) o gatilho também estiver como "Push to branch"
# nos mesmos branches (main/develop), cada push gera DOIS builds: um pelo trigger
# automático e outro por este workflow. Escolha uma estratégia:
#   - desativar o evento automático do trigger e deixar só este workflow; ou
#   - desativar este workflow e confiar só no trigger; ou
#   - mudar este workflow para workflow_dispatch (só manual).
#
# Nome do trigger no GCP (ajuste se renomear no Console):
#   coffe-gds-backend-trigger

name: Deploy backend — GCP (Cloud Build)

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  CLOUD_BUILD_TRIGGER_NAME: coffe-gds-backend-trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Cloud Build — disparar trigger (fonte no GitHub)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          GCP_PROJECT_ID="$(printf '%s' "${GCP_PROJECT_ID}" | tr -d '[:space:]')"
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID (secret) está vazio."
            exit 1
          fi
          gcloud config set project "${GCP_PROJECT_ID}"
          echo "gcloud project=$(gcloud config get-value project)"

          # Mesma tag/imagem que antes (.commit SHA); override via substituições do trigger.
          gcloud builds triggers run "${CLOUD_BUILD_TRIGGER_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --branch="${GITHUB_REF_NAME}" \
            --substitutions="_TAG=${GITHUB_SHA}"
