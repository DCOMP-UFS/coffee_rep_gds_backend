# Deploy no GCP: Cloud Build → Artifact Registry → Cloud Run (usa coffee_rep_gds_backend/cloudbuild.yaml).
# Autenticação: Workload Identity Federation (OIDC) — sem chave JSON no GitHub.
#
# Configuração GCP (visão geral): criar Pool + Provider OIDC para GitHub
# (issuer https://token.actions.githubusercontent.com), condição por repositório,
# e permitir que essa identidade use a service account indicada em GCP_WIF_SERVICE_ACCOUNT.
# Documentação: https://cloud.google.com/iam/docs/workload-identity-federation-with-deployment-providers#github-actions
#
# Secrets no GitHub (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER   → projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_WIF_SERVICE_ACCOUNT          → ex.: github-actions-wif@PROJETO.iam.gserviceaccount.com
#
# A SA acima precisa, no mínimo, conseguir executar `gcloud builds submit` no projeto
# (ex.: roles/cloudbuild.builds.editor + escrita no bucket de staging do Cloud Build).
#
# Opcional — sobrescreve substituições do cloudbuild (_ADMIN_*, _CORS_*):
#   ADMIN_CPF, ADMIN_PASSWORD, CORS_ORIGINS
# (Senhas com vírgula podem quebrar substituições; prefira ajustar só na GCP ou usar delimiter ^:^ no gcloud.)

name: Deploy backend — GCP (Cloud Build)

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  # Se o repositório Git for monorepo, coloque aqui o caminho até esta pasta (ex.: coffee_rep_gds_backend). Se o repo for só o backend, deixe vazio.
  BACKEND_PATH: ""

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Cloud Build — imagem + deploy Cloud Run
        env:
          BACKEND_PATH: ${{ env.BACKEND_PATH }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Evita espaços/newline acidental no secret e força o projeto certo no bucket *_cloudbuild
          GCP_PROJECT_ID="$(printf '%s' "${GCP_PROJECT_ID}" | tr -d '[:space:]')"
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID (secret) está vazio."
            exit 1
          fi
          gcloud config set project "${GCP_PROJECT_ID}"
          echo "gcloud project=$(gcloud config get-value project)"
          cd "${GITHUB_WORKSPACE}"
          if [ -n "${BACKEND_PATH}" ]; then
            cd "${BACKEND_PATH}"
          fi
          if [ ! -f cloudbuild.yaml ]; then
            echo "::error::cloudbuild.yaml não encontrado em $(pwd). Ajuste env BACKEND_PATH neste workflow."
            exit 1
          fi
          SUBST="_REGION=${{ env.REGION }},_REPO_NAME=coffee-rep,_IMAGE_NAME=coffee-rep-api,_TAG=${{ github.sha }}"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --substitutions="${SUBST}" \
            .
