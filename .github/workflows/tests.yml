name: Backend tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Por padrão o binário do mongod vai parar em `node_modules/.cache`, que o `pnpm
      # install` pode recriar. Fixar o destino dá um caminho estável para o cache abaixo.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # O download do mongod passa de 120 MB e acontece no postinstall, então o cache precisa
      # ser restaurado antes da instalação das dependências.
      - name: Cache do binário do MongoDB
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
