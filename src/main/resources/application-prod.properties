# Produção: prefira montar chaves via Secret Manager (file:) — ver GCP_CLOUD_RUN.md
jwt.public.key=${JWT_PUBLIC_KEY:classpath:app.pub}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:app.key}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

server.port=${PORT:8080}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

expiration-time=${EXPIRATION_TIME:86400}

admin-cpf=${ADMIN_CPF}
admin-password=${ADMIN_PASSWORD}